name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy --dry-run

  validate-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r python/requirements.txt
      - run: python -m py_compile python/app.py examples/python.py
      - run: |
          cd python
          (python -m uvicorn app:app --port 8000 &) 
          sleep 12
          curl -sf "http://127.0.0.1:8000/toptv?limit=1" | grep -o '"count":250'
          curl -sf "http://127.0.0.1:8000/top250?limit=1" | grep -o '"count":250'
          curl -sf "http://127.0.0.1:8000/top250?search=godfather" | grep -o 'The Godfather'
          curl -sf "http://127.0.0.1:8000/top250?year=1994&limit=5" | grep -o '"year":1994'
          curl -sf "http://127.0.0.1:8000/top250?min_rating=9&limit=3" | grep -o '"min_rating":9'
          curl -sf "http://127.0.0.1:8000/toptv?offset=10&limit=5" | grep -o '"offset":10'
          curl -sf "http://127.0.0.1:8000/movie/tt0111161" | grep -o 'Shawshank'
          curl -sf "http://127.0.0.1:8000/tv/tt0903747" | grep -o 'Breaking Bad'
          curl -sf "http://127.0.0.1:8000/random?type=movie" | grep -o '"type":"movie"'
